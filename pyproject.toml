[project]
name = "ha-roller-shutter-suite"
version = "0.0.1"
description = "Home Assistant custom integration that is the single authority over roller shutters"
readme = "README.md"
license = "MIT"
# Home Assistant 2026.9 requires Python 3.14.2 or newer.
requires-python = ">=3.14.2"
# The integration runs inside Home Assistant and has no runtime dependencies of
# its own. Everything below is for development only.
dependencies = []

[dependency-groups]
dev = [
  # Pins the Home Assistant version the integration is developed against:
  # 0.13.365 depends on homeassistant==2026.9.2.
  "pytest-homeassistant-custom-component==0.13.365",
  "ruff==0.16.8",
  "mypy==2.3.1",
]

[tool.uv]
# This is a Home Assistant custom integration, not an installable Python package.
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "A", # flake8-builtins
  "ASYNC", # flake8-async
  "B", # flake8-bugbear
  "BLE", # flake8-blind-except
  "C4", # flake8-comprehensions
  "D", # pydocstyle
  "DTZ", # flake8-datetimez: naive datetimes are rejected
  "E", # pycodestyle errors
  "F", # pyflakes
  "G", # flake8-logging-format
  "I", # isort
  "ICN", # flake8-import-conventions
  "LOG", # flake8-logging
  "N", # pep8-naming
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie
  "PL", # pylint
  "PT", # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "RUF", # ruff-specific rules
  "S", # flake8-bandit
  "SIM", # flake8-simplify
  "SLF", # flake8-self
  "T20", # flake8-print
  "TC", # flake8-type-checking
  "TID", # flake8-tidy-imports
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W", # pycodestyle warnings
]
ignore = [
  "D203", # conflicts with D211 (no blank line before class docstring)
  "D213", # conflicts with D212 (summary on the first docstring line)
  "E501", # line length is the formatter's job
  "TC001", # moving imports into TYPE_CHECKING blocks is not worth the noise,
  "TC002", # and Home Assistant resolves some annotations at runtime
  "TC003",
  "TRY003", # long exception messages are fine
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"voluptuous".msg = "Schemas are written with probatio"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", # pytest tests are written with assert
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
# This configuration applies to `uv run pytest` and to every run that includes
# tests/ha. A run of tests/core alone uses tests/core/pytest.ini instead, which
# keeps the Home Assistant test plugin out; see docs/dev/testing.md.
testpaths = ["tests"]
# The repository root is on the import path, so tests import the integration
# as `custom_components.roller_shutter_suite`.
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
filterwarnings = [
  # Every warning is an error. Exceptions for third-party noise go below this
  # line, each as narrow as possible (message, category and module) and with a
  # comment that says where the warning comes from. There are none at present.
  "error",
]

[tool.coverage.run]
# Measured on request with `uv run pytest --cov`; no threshold is enforced yet.
source = ["custom_components/roller_shutter_suite"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/roller_shutter_suite"]
explicit_package_bases = true
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
