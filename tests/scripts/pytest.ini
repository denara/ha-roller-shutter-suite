# Configuration of a run that contains only tests/scripts, for example
# `uv run pytest tests/scripts`: the unit tests of the guard scripts under
# scripts/. Like the scripts themselves they need only plain Python, so the Home
# Assistant test plugin is switched off and they run on every platform,
# including native Windows.
#
# A run that also contains tests/ha (plain `uv run pytest`) uses pyproject.toml.
# Keep the settings that both share identical;
# tests/core/test_pytest_configuration.py compares them.
[pytest]
addopts = -p no:homeassistant --import-mode=importlib --strict-markers --strict-config
# The repository root, relative to this file.
pythonpath = ../..
asyncio_mode = auto
markers =
    year: the year scenario of the time-lapse simulation, which CI runs without coverage in a step of its own
filterwarnings =
    error
