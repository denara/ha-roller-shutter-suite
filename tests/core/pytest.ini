# Configuration of a run that contains only tests/core, for example
# `uv run pytest tests/core`. pytest uses the configuration file closest to the
# paths it is given, so this file wins over pyproject.toml for such a run.
#
# The Home Assistant test plugin imports `homeassistant` as soon as pytest
# loads it, long before the first test. It is switched off here, so that
# conftest.py can prove that the core tests import nothing from Home Assistant,
# and so that the core tests run on every platform.
#
# A run that also contains tests/ha (plain `uv run pytest`) uses pyproject.toml.
# Keep the settings that both share identical.
[pytest]
addopts = -p no:homeassistant --import-mode=importlib --strict-markers --strict-config
# The repository root, relative to this file.
pythonpath = ../..
asyncio_mode = auto
filterwarnings =
    error
