[[deprecated]]
kind = "module"
name = "voluptuous"
behavior = "silent"
reason = "Home Assistant Core 2026.9 depends on probatio and no longer lists voluptuous as a requirement."
replacement = "probatio"
source = "Package metadata of homeassistant 2026.9.2; project brief, section 6"

[[deprecated]]
kind = "attribute"
name = "config_entries"
# `hass.config_entries` is the config entry manager, and
# `homeassistant.config_entries` is a module. Everything else that has an
# attribute of this name is a device entry as far as this integration goes.
allowed_receivers = ["hass", "_hass", "homeassistant"]
behavior = "silent"
reason = "A device belongs to exactly one config entry since Home Assistant 2026.8; DeviceEntry.config_entries is a compatibility shim."
replacement = "DeviceEntry.config_entry_id"
source = "homeassistant/helpers/device_registry.py, Core 2026.9.2: the property returns a value and reports nothing"

[[deprecated]]
kind = "identifier"
name = "config_entries_subentries"
behavior = "silent"
reason = "A device belongs to one config entry and at most one subentry; DeviceEntry.config_entries_subentries is a compatibility shim."
replacement = "DeviceEntry.config_entry_id and DeviceEntry.config_subentry_id"
source = "homeassistant/helpers/device_registry.py, Core 2026.9.2: the property returns a value and reports nothing"

[[deprecated]]
kind = "identifier"
name = "primary_config_entry"
behavior = "silent"
reason = "A device belongs to one config entry; DeviceEntry.primary_config_entry is a compatibility shim."
replacement = "DeviceEntry.config_entry_id"
source = "homeassistant/helpers/device_registry.py, Core 2026.9.2: the property returns a value and reports nothing"

[[deprecated]]
kind = "identifier"
name = "async_get_device"
behavior = "logs"
reason = "DeviceRegistry.async_get_device is deprecated because identifiers and connections are no longer unique across config entries; it breaks in Home Assistant 2027.8."
replacement = "async_get_device_by_identifier, async_get_device_by_connection or async_get_devices"
source = "homeassistant/helpers/device_registry.py, Core 2026.9.2: the method calls report_usage"

[[deprecated]]
kind = "mapping"
name = "devices"
behavior = "logs"
reason = "Using DeviceRegistry.devices as a mapping (subscription, .get(), .values(), .items() and the other lookup methods) is deprecated and breaks in Home Assistant 2027.9."
replacement = "Iterate registry.devices, or use async_get, async_entries_for_config_entry and similar helpers."
source = "homeassistant/helpers/device_registry.py, Core 2026.9.2: the view returned by the property calls report_usage"

[[deprecated]]
kind = "identifier"
name = "deleted_devices"
behavior = "logs"
reason = "DeviceRegistry.deleted_devices is an internal detail of the registry; reading it is deprecated and breaks in Home Assistant 2027.9."
replacement = "Nothing; the integration has no need for deleted devices."
source = "homeassistant/helpers/device_registry.py, Core 2026.9.2: the property calls report_usage"

[[deprecated]]
kind = "identifier"
name = "async_is_composite_device_id"
behavior = "logs"
reason = "DeviceRegistry.async_is_composite_device_id is deprecated and breaks in Home Assistant 2027.9."
replacement = "async_get with include_composite_devices=False"
source = "homeassistant/helpers/device_registry.py, Core 2026.9.2: the method calls report_usage"

[[deprecated]]
kind = "attribute"
name = "suggested_area"
# Passing `suggested_area` in DeviceInfo is a dictionary key, not an attribute,
# and is not matched. Nothing legitimate has an attribute of this name.
allowed_receivers = []
behavior = "logs"
reason = "Reading DeviceEntry.suggested_area is deprecated; removal was announced for Home Assistant 2026.9, the property is still present and logs."
replacement = "Nothing; use the device's area_id if the area is needed."
source = "homeassistant/helpers/device_registry.py, Core 2026.9.2: the property is wrapped in deprecated_function"
