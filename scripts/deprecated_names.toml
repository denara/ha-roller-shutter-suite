[[deprecated]]
kind = "attribute"
name = "suggested_area"
# Passing `suggested_area` in DeviceInfo is a dictionary key, not an attribute,
# and is not matched. Read from a device entry, or from the result of a
# registry call that returns one.
receivers = ["device", "device_entry", "_device"]
behavior = "logs"
reason = "Reading DeviceEntry.suggested_area is deprecated; removal was announced for Home Assistant 2026.9, the property is still present and logs."
replacement = "Nothing; use the device's area_id if the area is needed."
source = "homeassistant/helpers/device_registry.py, Core 2026.9.2: the property is wrapped in deprecated_function"

# The keyword arguments of DeviceRegistry.async_update_device that Core
