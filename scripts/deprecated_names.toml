# Home Assistant names that are known to be deprecated and must not be
# referenced by this integration or its tests. Read by
# scripts/check_deprecated_names.py.
#
# This list is meant to grow: whoever learns of a deprecation that concerns this
# integration adds it here. It is a second net, not the first: the log guard of
# the Home Assistant tests catches what Home Assistant reports at runtime, this
# list also catches names that Home Assistant keeps as silent compatibility
# shims, and code that no test reaches.
#
# Every entry has these fields:
#
#   kind         how the name is matched, see below
#   name         the deprecated name
#   behavior     "silent": Home Assistant logs nothing, only this list can catch
#                it, so the name is matched broadly, wherever it appears.
#                "logs": Home Assistant logs a report, the log guard catches it
#                too when a test reaches the code, so the name is matched
#                narrowly, where Home Assistant exposes it.
#   reason       why it is deprecated and when it breaks
#   replacement  what to use instead; the guard prints it
#   source       where this was verified. Verify against the Core source at the
#                tested version before adding an entry; add nothing unverified.
#
# kind = "identifier": the name itself. Broad (silent): forbidden wherever it
#   appears as a variable, attribute, imported name, keyword argument or
#   definition. Narrow (logs): forbidden when it is imported, and when it is
#   read from one of the `receivers` (the module it lives in, for example).
# kind = "module": importing the module (or anything below it) is forbidden.
# kind = "attribute": reading `.name` from an object. Broad (silent): from any
#   object except those in `allowed_receivers`. Narrow (logs): from the objects
#   in `receivers` and from the result of a call (`async_get(hass).name`).
#   A receiver is given by its last name: "hass" stands for `hass.name`,
#   `self.hass.name` and `entry.hass.name`.
# kind = "mapping": `<object>.name[...]` and `<object>.name.<anything>` are
#   forbidden, iterating `<object>.name` and `len()` are not. The receivers
#   work as for "attribute".
# kind = "keyword": passing `name=...` to a call of `<object>.<method>(...)`
#   is forbidden; `method` names the method, the receivers work as for
#   "attribute". The same keyword on any other call is not matched.
#
# `receivers` is a guess at how the code names the object; a narrow entry can
# miss a use on another name, and then the log guard is the net. `registry`
# and `device_registry`, with a leading underscore for an attribute of an own
# object, are the names used for the device registry here.

[[deprecated]]
kind = "attribute"
name = "show_advanced_options"
receivers = ["self"]
behavior = "logs"
reason = "FlowHandler.show_advanced_options is deprecated since 2026-05-26 and breaks in Home Assistant 2027.6."
replacement = "Group additional options in sections of the form."
source = "homeassistant/data_entry_flow.py, Core 2026.9.2: the property is wrapped in deprecated_function (breaks in 2027.6); the date is from the project brief, section 6"

