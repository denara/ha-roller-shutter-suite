name = "add_config_entry_id"
method = "async_update_device"
receivers = ["registry", "_registry", "device_registry", "_device_registry"]
behavior = "logs"
reason = "A device belongs to a single config entry; add_config_entry_id of async_update_device is deprecated and breaks in Home Assistant 2027.8."
